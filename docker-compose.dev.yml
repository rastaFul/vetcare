version: '3.9'

# restart: always everywhere in this file (not unless-stopped, changed
# 2026-09-09) -- see infra-platform .specs/audit/execution.md (2026-09-09):
# `unless-stopped` doesn't resurrect a container that crashed and was already
# Exited before a later Docker Desktop stop/start cycle (local dev machine,
# user stops/starts Docker Desktop itself); `always` does.

networks:
  # Named explicitly 2026-08-29 -- was relying on Compose's implicit
  # "vetcare_default" name, the only one of the 4 products not following
  # the <project>_net convention (microgrow_net, artists_net,
  # rastafinancas_net) documented in
  # infra-platform/docs/reference/repository-layout.md. Purely cosmetic --
  # isolation was already correct either way, this just makes the name
  # match the convention.
  default:
    name: vetcare_net
    driver: bridge
  platform_net:
    name: platform_net
    external: true   # owned by infra-platform/platform/docker-compose.yml, reach loki:3100

services:
  postgres:
    image: postgres:18-alpine
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: vetcare_dev
      POSTGRES_USER: vetcare
      POSTGRES_PASSWORD: vetcare_secret
    volumes:
      # New volume + parent-dir mount point (2026-09-15, infra-full-upgrade-
      # 2026-09 Lote 9): same real bug hit and fixed on platform-glitchtip-db
      # -- postgres 18+ images refuse a volume mounted directly at
      # `.../data` on a fresh volume (docker-library/postgres#37/#1259).
      # Old volume `postgres_dev_data` (pg16) kept as rollback, not deleted.
      - postgres_dev_data_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetcare"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres_test:
    image: postgres:18-alpine
    restart: always
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: vetcare_test
      POSTGRES_USER: vetcare
      POSTGRES_PASSWORD: vetcare_secret

  # Added 2026-08-28 (migration off PM2, see infra-platform
  # .specs/features/local-boot-persistence/spec.md). Filename kept as-is.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vetcare
    ports:
      - "127.0.0.1:3004:3004"
    env_file:
      - ./.env
    environment:
      # .env has DATABASE_URL pointing at localhost:5432 (bare PM2 process,
      # same host namespace as the published postgres port). Containerized,
      # postgres is reached by its Compose service name on the shared
      # default network instead.
      - DATABASE_URL=postgresql://vetcare:vetcare_secret@postgres:5432/vetcare_dev
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # Added 2026-08-29 (features/observability-promtail-docker/spec.md in
  # infra-platform), migrated from Promtail to Grafana Alloy 2026-09-15
  # (features/infra-full-upgrade-2026-09/spec.md, Lote 2 -- Promtail EOL
  # since 03/2026). Container renamed vetcare-promtail -> vetcare-alloy to
  # reflect the new component; config.alloy converted from the old
  # config.yml (kept in ./promtail/ as historical reference, unused).
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: vetcare-alloy
    networks:
      - platform_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    restart: always

volumes:
  postgres_dev_data: # pg16, kept as rollback, unused after Lote 9
  postgres_dev_data_pg18:
  alloy_data:
