version: '3.9'

networks:
  default: {}
  platform_net:
    name: platform_net
    external: true   # owned by infra-platform/platform/docker-compose.yml, reach loki:3100

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: vetcare_dev
      POSTGRES_USER: vetcare
      POSTGRES_PASSWORD: vetcare_secret
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetcare"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: vetcare_test
      POSTGRES_USER: vetcare
      POSTGRES_PASSWORD: vetcare_secret

  # Added 2026-08-28 (migration off PM2, see infra-platform
  # .specs/features/local-boot-persistence/spec.md). Filename kept as-is.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vetcare
    ports:
      - "127.0.0.1:3004:3004"
    env_file:
      - ./.env
    environment:
      # .env has DATABASE_URL pointing at localhost:5432 (bare PM2 process,
      # same host namespace as the published postgres port). Containerized,
      # postgres is reached by its Compose service name on the shared
      # default network instead.
      - DATABASE_URL=postgresql://vetcare:vetcare_secret@postgres:5432/vetcare_dev
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Added 2026-08-29 (features/observability-promtail-docker/spec.md in
  # infra-platform). vetcare never had log shipping to Loki before --
  # same docker_sd_configs pattern already proven in
  # rastafinancas/microgrow's promtails.
  promtail:
    image: grafana/promtail:2.9.0
    container_name: vetcare-promtail
    networks:
      - platform_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/tmp/promtail
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped

volumes:
  postgres_dev_data:
  promtail_positions:
