services:
  evolution-api:
    # Achado real (2026-09-15, infra-full-upgrade-2026-09 Lote 11, D5):
    # `atendai/evolution-api` não existe mais no Docker Hub (`pull access
    # denied: repository does not exist` -- confirmado via pull real, não
    # suposição). Projeto migrou pra Evolution Foundation, imagem oficial
    # agora é `evoapicloud/evolution-api`. Pinado em v2.3.7 (última stable
    # antes do v2.4.0, que introduz ativação obrigatória contra um servidor
    # de licenciamento da Evolution Foundation -- mudança operacional grande
    # demais pra decidir sozinho numa spec de bump de versão; ver dúvidas
    # finais). Serviço estava dormant nesta sessão (não rodando antes),
    # continua não religado.
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      evolution-db:
        condition: service_healthy
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-vetcare-dev-key-change-in-prod}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      # Storage: PostgreSQL (necessário para migration do Prisma)
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution_secret@evolution-db:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution-api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      # Logs
      LOG_LEVEL: ERROR
      LOG_COLOR: "true"
      # Webhook (configurado por instância via API)
      WEBHOOK_GLOBAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5

  evolution-db:
    image: postgres:18-alpine
    container_name: evolution-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_secret
      POSTGRES_DB: evolution
    volumes:
      # New volume + parent-dir mount point (2026-09-15, infra-full-upgrade-
      # 2026-09 Lote 9) -- same postgres 18+ mount-point bug fixed on
      # platform-glitchtip-db and vetcare's own `postgres` service. Old
      # volume `evolution_db` (pg16) kept as rollback, not deleted.
      - evolution_db_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evolution_instances:
  evolution_db: # pg16, kept as rollback, unused after Lote 9
  evolution_db_pg18:
